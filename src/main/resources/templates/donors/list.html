<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('قائمة المتبرعين')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 class="card-header" style="margin:0;">المتبرعون</h2>
            <a href="/donors/new" class="btn btn-primary">+ متبرع جديد</a>
        </div>

        <div class="table-wrapper">
            <table class="table">
                <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>الهاتف</th>
                    <th>إجمالي الالتزامات</th>
                    <th>المدفوع</th>
                    <th>المتبقي</th>
                    <th style="min-width:120px;">التقدم</th>
                    <th>إجراء</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="donor : ${donors}">
                    <td style="font-weight:600;" th:text="${donor.fullName}">-</td>
                    <td th:text="${donor.telephone}">-</td>
                    <td dir="ltr"
                        th:text="${#numbers.formatDecimal(donor.totalCommitments, 0, 'COMMA', 0, 'POINT')} + ' MRU'">0 MRU</td>
                    <td dir="ltr" style="color:var(--primary); font-weight:600;"
                        th:text="${#numbers.formatDecimal(donor.totalPaid, 0, 'COMMA', 0, 'POINT')} + ' MRU'">0 MRU</td>
                    <td dir="ltr" style="color:var(--danger); font-weight:600;"
                        th:text="${donor.remainingBalance.compareTo(T(java.math.BigDecimal).ZERO) > 0} ? ${#numbers.formatDecimal(donor.remainingBalance, 0, 'COMMA', 0, 'POINT')} + ' MRU' : '✓'">0 MRU</td>
                    <td>
                        <div th:with="pct=${donor.totalCommitments.compareTo(T(java.math.BigDecimal).ZERO) > 0 ? donor.totalPaid.multiply(new java.math.BigDecimal(100)).divide(donor.totalCommitments, 0, T(java.math.RoundingMode).HALF_UP).min(new java.math.BigDecimal(100)) : T(java.math.BigDecimal).ZERO}">
                            <div style="background:#d0e8d8;border-radius:4px;height:8px;overflow:hidden;margin-bottom:2px;">
                                <div th:style="'width:' + ${pct} + '%;background:' + (${pct.intValue() >= 100} ? '#1B6B3A' : (${pct.intValue() >= 50} ? '#B8860B' : '#C0392B')) + ';height:100%;'"></div>
                            </div>
                            <small th:text="${pct} + '%'" style="color:var(--text-muted);font-size:11px;">0%</small>
                        </div>
                    </td>
                    <td>
                        <a th:href="@{/donors/{id}(id=${donor.id})}" class="btn btn-primary btn-sm">عرض</a>
                        <a th:href="@{/api/reports/donor/{id}/payments(id=${donor.id})}"
                           class="btn btn-accent btn-sm" target="_blank">PDF</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
