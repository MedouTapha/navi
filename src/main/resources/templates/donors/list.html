<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Liste des Donateurs')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 class="card-header" style="margin: 0;">🤝 Liste des Donateurs</h2>
            <a href="/donors/new" class="btn btn-primary">+ Nouveau Donateur</a>
        </div>

        <div style="overflow-x: auto;">
            <table class="table">
                <thead>
                <tr>
                    <th>Nom Complet</th>
                    <th>Téléphone</th>
                    <th>Email</th>
                    <th>Total Engagements</th>
                    <th>Total Payé</th>
                    <th>Solde Restant</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="donor : ${donors}">
                    <td th:text="${donor.fullName}">Nom</td>
                    <td th:text="${donor.telephone}">Téléphone</td>
                    <td th:text="${donor.email}">Email</td>
                    <td th:text="${#numbers.formatDecimal(donor.totalCommitments, 0, 'COMMA', 2, 'POINT')} + ' MRU'">0.00 MRU</td>
                    <td style="color: #27ae60; font-weight: 600;" th:text="${#numbers.formatDecimal(donor.totalPaid, 0, 'COMMA', 2, 'POINT')} + ' MRU'">0.00 MRU</td>
                    <td style="color: #e74c3c; font-weight: 600;" th:text="${#numbers.formatDecimal(donor.remainingBalance, 0, 'COMMA', 2, 'POINT')} + ' MRU'">0.00 MRU</td>
                    <td>
                        <a th:href="@{/donors/{id}(id=${donor.id})}" class="btn btn-primary btn-sm">Voir</a>
                        <a th:href="@{/api/reports/donor/{id}/payments(id=${donor.id})}" class="btn btn-success btn-sm" target="_blank">Rapport</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
