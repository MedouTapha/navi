<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('نموذج المتبرع')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <div class="card">
        <h2 class="card-header" th:text="${donor != null} ? 'تعديل المتبرع' : 'متبرع جديد'">نموذج المتبرع</h2>

        <form th:action="${donor != null} ? @{/donors/{id}/edit(id=${donor.id})} : @{/donors/new}"
              method="post">

            <div class="form-group">
                <label>الاسم الأول *</label>
                <input type="text" class="form-control" name="firstName" required
                       th:value="${donor != null} ? ${donor.firstName} : ''" />
            </div>

            <div class="form-group">
                <label>الاسم الأخير *</label>
                <input type="text" class="form-control" name="lastName" required
                       th:value="${donor != null} ? ${donor.lastName} : ''" />
            </div>

            <div class="form-group">
                <label>الهاتف *</label>
                <input type="tel" class="form-control" name="telephone" required
                       th:value="${donor != null} ? ${donor.telephone} : ''" placeholder="2X XXX XXX" />
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" class="form-control" name="email"
                       th:value="${donor != null} ? ${donor.email} : ''" />
            </div>

            <div class="form-group">
                <label>ملاحظات</label>
                <textarea class="form-control" name="notes" rows="3"
                          th:text="${donor != null} ? ${donor.notes} : ''"></textarea>
            </div>

            <div style="margin-top:24px; display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">حفظ</button>
                <a href="/donors" class="btn btn-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
