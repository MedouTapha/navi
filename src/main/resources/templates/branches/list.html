<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('قائمة الفروع')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <div class="card">
        <h2 class="card-header">🏢 قائمة الفروع</h2>

        <div class="grid">
            <div th:each="branch : ${branches}" class="card">
                <h3 th:text="${branch.nameAr}">الفرع</h3>
                <p><strong>عدد الفصول:</strong> <span th:text="${branch.totalClasses}">0</span></p>
                <p><strong>مصاريف الشهر:</strong> MRU <span th:text="${#numbers.formatDecimal(branch.monthlyExpenses, 0, 'COMMA', 1, 'POINT')}">0.0</span></p>
                <div style="margin-top: 15px;">
                    <a th:href="@{/branches/{id}(id=${branch.id})}" class="btn btn-primary" style="width: 100%;">عرض التفاصيل</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
