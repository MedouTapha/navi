<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ — معهد الإمام نافع</title>
    <style>
        :root { --primary: #1B6B3A; --primary-dark: #134d2a; --accent: #B8860B; --danger: #C0392B; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f4;
            color: #1a2e1a;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            max-width: 460px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            border-top: 5px solid var(--danger);
        }
        .error-code { font-size: 56px; font-weight: 800; color: var(--danger); line-height: 1; }
        .error-title { font-size: 20px; margin: 14px 0 8px; color: var(--primary-dark); }
        .error-msg { color: #6c7569; font-size: 14px; margin-bottom: 24px; }
        .btn-home {
            display: inline-block;
            padding: 11px 24px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            transition: background .2s;
        }
        .btn-home:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code" th:text="${status} ?: '!'">خطأ</div>
    <h1 class="error-title" th:switch="${status}">
        <span th:case="404">الصفحة غير موجودة</span>
        <span th:case="403">الوصول مرفوض</span>
        <span th:case="500">خطأ في الخادم</span>
        <span th:case="*">حدث خطأ</span>
    </h1>
    <p class="error-msg">عذراً، حدث خطأ أثناء معالجة طلبك.</p>
    <a href="/dashboard" class="btn-home">العودة إلى لوحة التحكم</a>
</div>
</body>
</html>
