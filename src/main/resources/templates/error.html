<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ — معهد الإمام نافع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bcm-tokens.css}" href="/css/bcm-tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--bcm-font-sans);
            background: var(--bcm-bg);
            color: var(--bcm-text);
            font-size: var(--bcm-fs-base);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: var(--bcm-surface);
            border-radius: var(--bcm-radius);
            box-shadow: var(--bcm-shadow-pop);
            border: var(--bcm-border-w) solid var(--bcm-border);
            border-top: 3px solid var(--bcm-danger);
            max-width: 460px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .error-code { font-size: 48px; font-weight: var(--bcm-fw-bold); color: var(--bcm-danger); line-height: 1; }
        .error-title { font-size: var(--bcm-fs-lg); font-weight: var(--bcm-fw-medium); margin: 14px 0 8px; color: var(--bcm-text); }
        .error-msg { color: var(--bcm-text-muted); font-size: var(--bcm-fs-base); margin-bottom: 24px; }
        .btn-home {
            display: inline-block;
            padding: 11px 24px;
            background: var(--bcm-primary);
            color: var(--bcm-on-primary);
            text-decoration: none;
            border-radius: var(--bcm-radius);
            border: var(--bcm-border-w) solid var(--bcm-primary-700);
            font-weight: var(--bcm-fw-medium);
            transition: background .2s;
        }
        .btn-home:hover { background: var(--bcm-primary-700); }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code" th:text="${status} ?: '!'">خطأ</div>
    <h1 class="error-title" th:switch="${status}">
        <span th:case="404">الصفحة غير موجودة</span>
        <span th:case="403">الوصول مرفوض</span>
        <span th:case="500">خطأ في الخادم</span>
        <span th:case="*">حدث خطأ</span>
    </h1>
    <p class="error-msg">عذراً، حدث خطأ أثناء معالجة طلبك.</p>
    <a href="/dashboard" class="btn-home">العودة إلى لوحة التحكم</a>
</div>
</body>
</html>
