<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulaire Classe')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <div class="card">
        <h2 class="card-header" th:text="${class != null} ? 'Modifier la Classe' : 'Nouvelle Classe'">Formulaire Classe</h2>

        <div style="background: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
            <p style="margin: 0;">⚠️ Utilisez l'API REST pour créer/modifier une classe via <code>/api/classes</code></p>
            <p style="margin: 5px 0 0 0;">Cette page affiche uniquement le formulaire pour référence.</p>
        </div>

        <form id="classForm">
            <div class="form-group">
                <label for="nameFr">Nom en Français *</label>
                <input type="text" class="form-control" id="nameFr" name="nameFr" required
                       th:value="${class != null} ? ${class.nameFr} : ''">
            </div>

            <div class="form-group">
                <label for="nameAr">Nom en Arabe *</label>
                <input type="text" class="form-control" id="nameAr" name="nameAr" required
                       th:value="${class != null} ? ${class.nameAr} : ''">
            </div>

            <div class="form-group">
                <label for="branchId">Branche *</label>
                <select class="form-control" id="branchId" name="branchId" required>
                    <option value="">Sélectionnez une branche</option>
                    <option th:each="branch : ${branches}"
                            th:value="${branch.id}"
                            th:text="${branch.nameFr}"
                            th:selected="${class != null and class.branchId == branch.id}">
                        Branche
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="classType">Type de Classe *</label>
                <select class="form-control" id="classType" name="classType" required>
                    <option value="">Sélectionnez un type</option>
                    <option value="RECITATION" th:selected="${class != null and class.classType.name() == 'RECITATION'}">Récitation</option>
                    <option value="PEDAGOGICAL" th:selected="${class != null and class.classType.name() == 'PEDAGOGICAL'}">Pédagogique</option>
                </select>
            </div>

            <div class="form-group">
                <label for="monthlyFixedAmount">Montant Mensuel Fixe (MRU) *</label>
                <input type="number" step="0.01" class="form-control" id="monthlyFixedAmount" name="monthlyFixedAmount" required
                       th:value="${class != null} ? ${class.monthlyFixedAmount} : ''">
            </div>

            <div class="form-group">
                <label for="startDate">Date de Début *</label>
                <input type="date" class="form-control" id="startDate" name="startDate" required
                       th:value="${class != null} ? ${class.startDate} : ''">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"
                          th:text="${class != null} ? ${class.description} : ''"></textarea>
            </div>

            <div style="margin-top: 20px;">
                <button type="button" class="btn btn-primary" onclick="alert('Utilisez l\'API REST pour soumettre le formulaire')">
                    Enregistrer
                </button>
                <a href="/classes" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
