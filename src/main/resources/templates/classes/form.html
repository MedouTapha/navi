<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('نموذج الفصل')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <div class="card">
        <h2 class="card-header" th:text="${class != null} ? 'تعديل الفصل' : 'فصل جديد'">نموذج الفصل</h2>

        <form th:action="${class != null} ? @{/classes/{id}/edit(id=${class.id})} : @{/classes/new}"
              method="post">

            <div class="form-group">
                <label>الاسم بالعربية *</label>
                <input type="text" class="form-control" name="nameAr" required
                       th:value="${class != null} ? ${class.nameAr} : ''" placeholder="مثال: فصل التجويد" />
            </div>

            <div class="form-group">
                <label>الاسم بالفرنسية</label>
                <input type="text" class="form-control" name="nameFr"
                       th:value="${class != null} ? ${class.nameFr} : ''" placeholder="Ex: Classe Tajwid" />
            </div>

            <div class="form-group">
                <label>الفرع *</label>
                <select class="form-control" name="branchId" required>
                    <option value="">-- اختر الفرع --</option>
                    <option th:each="branch : ${branches}"
                            th:value="${branch.id}"
                            th:text="${branch.nameAr}"
                            th:selected="${class != null and class.branchId == branch.id}">الفرع</option>
                </select>
            </div>

            <div class="form-group">
                <label>نوع الفصل *</label>
                <select class="form-control" name="classType" required>
                    <option value="">-- اختر النوع --</option>
                    <option value="RECITATION" th:selected="${class != null and class.classType.name() == 'RECITATION'}">تلاوة</option>
                    <option value="PEDAGOGICAL" th:selected="${class != null and class.classType.name() == 'PEDAGOGICAL'}">تربوي</option>
                </select>
            </div>

            <div class="form-group">
                <label>الراتب الشهري الثابت (MRU) *</label>
                <input type="number" step="1" class="form-control" name="monthlyFixedAmount" required
                       th:value="${class != null} ? ${class.monthlyFixedAmount} : ''" placeholder="0" />
            </div>

            <div class="form-group">
                <label>تاريخ البداية *</label>
                <input type="date" class="form-control" name="startDate" required
                       th:value="${class != null} ? ${class.startDate} : ''" />
            </div>

            <div style="margin-top:24px; display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">حفظ</button>
                <a href="/classes" class="btn btn-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
