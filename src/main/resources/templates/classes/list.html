<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('قائمة الفصول')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 class="card-header" style="margin:0;">قائمة الفصول</h2>
            <a href="/classes/new" class="btn btn-primary">+ فصل جديد</a>
        </div>

        <div class="table-wrapper">
            <table class="table">
                <thead>
                <tr>
                    <th>الاسم</th>
                    <th>الفرع</th>
                    <th>النوع</th>
                    <th>الراتب الشهري</th>
                    <th>السنة المالية</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cls : ${classes}">
                    <td>
                        <div style="font-weight:600;" th:text="${cls.nameAr}">-</div>
                    </td>
                    <td th:text="${cls.branchName}">-</td>
                    <td><span class="badge badge-info" th:text="${cls.classType.arabicName}">-</span></td>
                    <td dir="ltr" style="font-weight:600;"
                        th:text="${#numbers.formatDecimal(cls.monthlyFixedAmount, 0, 'COMMA', 0, 'POINT')} + ' MRU'">0 MRU</td>
                    <td><span class="badge badge-success" th:text="${cls.currentFinancialYear}">-</span></td>
                    <td>
                        <span th:if="${cls.active}" class="badge badge-success">نشط</span>
                        <span th:unless="${cls.active}" class="badge badge-warning">غير نشط</span>
                    </td>
                    <td>
                        <a th:href="@{/classes/{id}(id=${cls.id})}" class="btn btn-primary btn-sm">عرض</a>
                        <a th:href="@{/classes/{id}/edit(id=${cls.id})}" class="btn btn-secondary btn-sm">تعديل</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
