<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('التقرير المالي الشهري')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">

    <!-- اختيار الشهر والسنة -->
    <div class="card" style="margin-bottom:20px;">
        <h3 class="card-header">اختر الشهر</h3>
        <form method="get" action="/rapport-mensuel"
              style="display:flex; gap:15px; align-items:flex-end; flex-wrap:wrap;">
            <div class="form-group" style="margin-bottom:0; flex:1; min-width:120px;">
                <label>الشهر</label>
                <select name="month" class="form-control">
                    <option value="1"  th:selected="${currentMonth == 1}">يناير</option>
                    <option value="2"  th:selected="${currentMonth == 2}">فبراير</option>
                    <option value="3"  th:selected="${currentMonth == 3}">مارس</option>
                    <option value="4"  th:selected="${currentMonth == 4}">أبريل</option>
                    <option value="5"  th:selected="${currentMonth == 5}">مايو</option>
                    <option value="6"  th:selected="${currentMonth == 6}">يونيو</option>
                    <option value="7"  th:selected="${currentMonth == 7}">يوليو</option>
                    <option value="8"  th:selected="${currentMonth == 8}">أغسطس</option>
                    <option value="9"  th:selected="${currentMonth == 9}">سبتمبر</option>
                    <option value="10" th:selected="${currentMonth == 10}">أكتوبر</option>
                    <option value="11" th:selected="${currentMonth == 11}">نوفمبر</option>
                    <option value="12" th:selected="${currentMonth == 12}">ديسمبر</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0; flex:1; min-width:100px;">
                <label>السنة</label>
                <input type="number" name="year" class="form-control"
                       th:value="${currentYear}" min="2023" max="2030"/>
            </div>
            <button type="submit" class="btn btn-primary">عرض التقرير</button>
            <button type="button" class="btn btn-secondary" onclick="window.print()">طباعة</button>
        </form>
    </div>

    <!-- رأس التقرير -->
    <div class="card report-header">
        <h2>معهد الإمام نافع لتعليم القرآن الكريم وعلومه</h2>
        <h3 style="font-weight:normal; margin-top:8px;">
            التقرير المالي لشهر:
            <strong th:text="${report.monthNameAr}">شهر</strong> /
            <strong th:text="${report.year}">2026</strong>
        </h3>
    </div>

    <!-- تقرير الفروع -->
    <div th:if="${report.branches.isEmpty()}" class="card"
         style="text-align:center; color:var(--text-muted); padding:40px;">
        لا توجد مصروفات مسجلة لهذا الشهر
    </div>

    <div th:each="branch : ${report.branches}" class="card branch-block">
        <div class="branch-title" th:text="${branch.branchNameAr}">الفرع</div>

        <table class="table report-table">
            <tbody>
            <tr th:each="line : ${branch.lines}"
                th:class="${line.extra} ? 'extra-line' : 'fixed-line'">
                <td th:text="${line.label}">اسم الأستاذ</td>
                <td class="amount-cell" dir="ltr"
                    th:text="${#numbers.formatDecimal(line.amount, 0, 'COMMA', 0, 'POINT')} + ' MRU'">0 MRU</td>
            </tr>
            </tbody>
            <tfoot>
            <tr class="total-row">
                <td><strong>الجميع</strong></td>
                <td class="amount-cell" dir="ltr">
                    <strong th:text="${#numbers.formatDecimal(branch.total, 0, 'COMMA', 0, 'POINT')} + ' MRU'">0 MRU</strong>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>

    <!-- الإجمالي العام -->
    <div class="card" th:if="${!report.branches.isEmpty()}"
         style="background:var(--danger-light); border:2px solid var(--danger); text-align:center; padding:20px;">
        <h3 style="color:var(--danger); margin-bottom:10px;">
            الإجمالي العام لشهر <span th:text="${report.monthNameAr}">شهر</span>
        </h3>
        <div style="font-size:28px; font-weight:bold; color:var(--danger);" dir="ltr"
             th:text="${#numbers.formatDecimal(report.grandTotal, 0, 'COMMA', 0, 'POINT')} + ' MRU'">
            0 MRU
        </div>
    </div>

</div>

<style>
.report-header {
    text-align: center;
    background: var(--primary);
    color: white;
    padding: 25px;
    border-top-color: var(--primary-dark);
}

.branch-block {
    border-right: 4px solid var(--primary);
    margin-bottom: 15px;
    padding: 15px 20px;
}

.branch-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
}

.report-table { min-width: unset; }
.report-table td { padding: 8px 12px; font-size: 15px; }

.fixed-line td { background: var(--bg); }

.extra-line td {
    background: var(--accent-light);
    color: var(--accent);
    font-style: italic;
}

.amount-cell {
    text-align: left !important;
    font-weight: 600;
    min-width: 130px;
}

.total-row td {
    background: var(--primary-light) !important;
    border-top: 2px solid var(--primary);
    color: var(--primary-dark);
    font-size: 16px;
}

@media print {
    .nav, form, .btn { display: none !important; }
    .card { box-shadow: none; border: 1px solid #ddd; }
    .branch-block { page-break-inside: avoid; }
}
</style>

</body>
</html>
