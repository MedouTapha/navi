<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      dir="rtl" lang="ar">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${title}">معهد الإمام نافع</title>
    <script>
        // Injecte automatiquement le jeton CSRF dans toutes les requêtes fetch mutantes.
        (function () {
            var t = document.querySelector('meta[name="_csrf"]');
            var h = document.querySelector('meta[name="_csrf_header"]');
            if (!t || !h || !t.content || !h.content) return;
            var token = t.content, header = h.content;
            var orig = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                var method = (init.method || 'GET').toUpperCase();
                if (method !== 'GET' && method !== 'HEAD') {
                    var hdrs = init.headers || {};
                    if (typeof Headers !== 'undefined' && hdrs instanceof Headers) {
                        hdrs.set(header, token);
                    } else {
                        hdrs[header] = token;
                    }
                    init.headers = hdrs;
                }
                return orig.call(this, input, init);
            };
        })();
    </script>
    <style>
        :root {
            --primary:   #1B6B3A;
            --primary-light: #e8f5ee;
            --primary-dark:  #134d2a;
            --accent:    #B8860B;
            --accent-light: #fdf6e3;
            --danger:    #C0392B;
            --danger-light: #fdecea;
            --text:      #1a2e1a;
            --text-muted:#6c7569;
            --bg:        #f4f6f4;
            --white:     #ffffff;
            --border:    #d8e4d8;
            --shadow:    0 2px 8px rgba(27,107,58,.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            direction: rtl;
            text-align: right;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        /* ── Header ── */
        .header {
            background: var(--primary);
            color: var(--white);
            padding: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        /* ── Navigation ── */
        .nav {
            background: var(--white);
            border-bottom: 3px solid var(--primary);
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .nav-links a {
            padding: 14px 20px;
            text-decoration: none;
            color: var(--text);
            display: block;
            transition: color .2s, border-bottom-color .2s;
            border-bottom: 3px solid transparent;
            margin-bottom: -3px;
            font-size: 14px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* ── Cards ── */
        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-top: 3px solid var(--primary);
        }

        .card-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--primary);
        }

        /* ── Buttons ── */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background .2s, opacity .2s;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .btn-primary   { background: var(--primary);  color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-success   { background: var(--primary);  color: var(--white); }
        .btn-success:hover { background: var(--primary-dark); }

        .btn-danger    { background: var(--danger);   color: var(--white); }
        .btn-danger:hover { opacity: .9; }

        .btn-secondary { background: #6c757d; color: var(--white); }
        .btn-secondary:hover { background: #5a6268; }

        .btn-accent    { background: var(--accent);   color: var(--white); }
        .btn-accent:hover { opacity: .9; }

        .btn-sm { padding: 6px 12px; font-size: 13px; }

        /* ── Table ── */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            min-width: 600px;
        }

        .table th,
        .table td {
            padding: 11px 12px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            background: var(--primary);
            color: var(--white);
            font-weight: 600;
            font-size: 13px;
        }

        .table tr:hover td { background: var(--primary-light); }

        /* ── Grid ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .financial-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        /* ── Financial blocks ── */
        .financial-block {
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .financial-block h4 { margin-bottom: 15px; font-size: 15px; }
        .financial-block p  { font-size: 14px; line-height: 1.8; margin: 7px 0; }

        /* ── Balance block ── */
        .balance-block {
            margin: 20px 0;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .balance-block h3 { margin: 0; font-size: 17px; }

        .balance-amount {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0;
        }

        /* ── Stats cards ── */
        .stats-card {
            background: var(--primary);
            color: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .stats-card h3      { font-size: 13px; opacity: .85; margin-bottom: 10px; }
        .stats-card .value  { font-size: 30px; font-weight: 700; }

        /* ── Form ── */
        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color .2s;
            background: var(--white);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ── Badges ── */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid #b8d8c8;
        }

        .badge-warning {
            background: var(--accent-light);
            color: #7a5800;
            border: 1px solid #e8d080;
        }

        .badge-info {
            background: #e8f0ff;
            color: #2c4a8a;
            border: 1px solid #b8ccf0;
        }

        /* ── Semantic text colors ── */
        .text-success { color: var(--primary)  !important; }
        .text-danger  { color: var(--danger)   !important; }
        .text-accent  { color: var(--accent)   !important; }
        .text-muted   { color: var(--text-muted) !important; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header h1 { font-size: 18px; }
            .table { font-size: 13px; }
            .table th, .table td { padding: 8px; }
            .grid { grid-template-columns: 1fr; }
            .financial-grid { grid-template-columns: 1fr; gap: 12px; margin: 12px 0; }
            .btn { padding: 12px 18px; font-size: 14px; min-height: 44px; }
            .btn-sm { padding: 8px 14px; font-size: 13px; min-height: 40px; }
            .nav-links a { padding: 12px 14px; font-size: 13px; }
            .card { padding: 14px; }
            .card-header { font-size: 16px; }
            .balance-amount { font-size: 22px; }
        }
    </style>
</head>

<body>
<div th:fragment="header">
    <div class="header">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
            <h1 style="margin:0;">معهد الإمام نافع لتعليم القرآن الكريم وعلومه</h1>
            <div style="display:flex; align-items:center; gap:12px; font-size:14px; white-space:nowrap;">
                <span sec:authentication="name" style="opacity:.9;">المستخدم</span>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-sm"
                            style="background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.35);">
                        خروج
                    </button>
                </form>
            </div>
        </div>
    </div>
    <nav class="nav">
        <ul class="nav-links">
            <li><a href="/dashboard"      th:classappend="${activePage == 'dashboard'} ? 'active'">لوحة التحكم</a></li>
            <li><a href="/branches"       th:classappend="${activePage == 'branches'}  ? 'active'">الفروع</a></li>
            <li><a href="/classes"        th:classappend="${activePage == 'classes'}   ? 'active'">الفصول</a></li>
            <li><a href="/donors"         th:classappend="${activePage == 'donors'}     ? 'active'">المتبرعون</a></li>
            <li><a href="/retards"        th:classappend="${activePage == 'retards'}    ? 'active'" style="color:var(--danger);">المتأخرون</a></li>
            <li><a href="/projection"     th:classappend="${activePage == 'projection'} ? 'active'">التوقعات</a></li>
            <li><a href="/rapport-mensuel" th:classappend="${activePage == 'rapport'}  ? 'active'">التقرير الشهري</a></li>
        </ul>
    </nav>
</div>
</body>
</html>
