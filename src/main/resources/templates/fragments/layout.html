<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      dir="rtl" lang="ar">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05a34a">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${title}">معهد الإمام نافع</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bcm-tokens.css}" href="/css/bcm-tokens.css">

    <script>
        // Injecte automatiquement le jeton CSRF dans toutes les requêtes fetch mutantes.
        (function () {
            var t = document.querySelector('meta[name="_csrf"]');
            var h = document.querySelector('meta[name="_csrf_header"]');
            if (!t || !h || !t.content || !h.content) return;
            var token = t.content, header = h.content;
            var orig = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                var method = (init.method || 'GET').toUpperCase();
                if (method !== 'GET' && method !== 'HEAD') {
                    var hdrs = init.headers || {};
                    if (typeof Headers !== 'undefined' && hdrs instanceof Headers) {
                        hdrs.set(header, token);
                    } else {
                        hdrs[header] = token;
                    }
                    init.headers = hdrs;
                }
                return orig.call(this, input, init);
            };
        })();
    </script>
    <style>
        /* Correspondance des noms internes → jetons BMCI (assets/bcm-tokens.css) */
        :root {
            --primary:       var(--bcm-primary);
            --primary-light: var(--bcm-primary-050);
            --primary-dark:  var(--bcm-primary-700);
            --accent:        var(--bcm-warning);
            --accent-light:  var(--bcm-warning-050);
            --danger:        var(--bcm-danger);
            --danger-light:  var(--bcm-danger-050);
            --text:          var(--bcm-text);
            --text-muted:    var(--bcm-text-muted);
            --bg:            var(--bcm-bg);
            --white:         var(--bcm-surface);
            --border:        var(--bcm-border);
            --shadow:        var(--bcm-shadow-card);
            --shadow-lg:     var(--bcm-shadow-pop);
            --radius:        var(--bcm-radius);
            --radius-sm:     var(--bcm-radius-sm);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--bcm-font-sans);
            background-color: var(--bg);
            color: var(--text);
            font-size: var(--bcm-fs-base);
            line-height: var(--bcm-lh);
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ───────────── Topbar ───────────── */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar {
            background: var(--bcm-primary);
            color: var(--bcm-on-primary);
            border-bottom: var(--bcm-border-w) solid var(--bcm-primary-800);
            padding-top: env(safe-area-inset-top);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 12px;
            padding-bottom: 12px;
        }

        .brand { display: flex; flex-direction: column; line-height: 1.25; flex: 1; min-width: 0; }
        .brand-title { font-size: var(--bcm-fs-lg); font-weight: var(--bcm-fw-medium); letter-spacing: .2px; }
        .brand-sub   { font-size: var(--bcm-fs-xs); font-weight: var(--bcm-fw-regular); opacity: .85; }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .user-name {
            font-size: var(--bcm-fs-sm);
            opacity: .92;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-logout {
            background: rgba(255,255,255,.14);
            color: #fff;
            border: var(--bcm-border-w) solid rgba(255,255,255,.45);
            border-radius: var(--bcm-radius);
            padding: 7px 16px;
            font-size: var(--bcm-fs-sm);
            font-weight: var(--bcm-fw-medium);
            font-family: inherit;
            cursor: pointer;
            transition: background .2s;
        }
        .btn-logout:hover { background: rgba(255,255,255,.26); }

        /* Hamburger */
        .nav-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,.14);
            border: none;
            border-radius: var(--bcm-radius);
            cursor: pointer;
            flex-shrink: 0;
        }
        .nav-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            background: #fff;
            margin: 0 auto;
            border-radius: 2px;
            transition: transform .25s, opacity .25s;
        }
        body.nav-open .nav-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        body.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
        body.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ───────────── Navigation ───────────── */
        .nav {
            background: var(--white);
            box-shadow: var(--shadow);
            border-bottom: var(--bcm-border-w) solid var(--border);
            margin-bottom: 20px;
        }
        .nav-links {
            display: flex;
            padding: 0;
            margin: 0;
            list-style: none;
            gap: 2px;
        }
        .nav-links a {
            padding: 14px 18px;
            text-decoration: none;
            color: var(--text);
            display: block;
            font-size: var(--bcm-fs-base);
            font-weight: var(--bcm-fw-medium);
            border-bottom: 2px solid transparent;
            transition: color .15s, background .15s, border-color .15s;
            white-space: nowrap;
        }
        .nav-links a:hover { color: var(--primary); background: var(--primary-light); }
        .nav-links a.active {
            color: var(--primary-dark);
            border-bottom-color: var(--primary);
            font-weight: var(--bcm-fw-bold);
        }

        /* ───────────── Cards ───────────── */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: var(--bcm-border-w) solid var(--border);
        }
        .card-header {
            font-size: var(--bcm-fs-md);
            font-weight: var(--bcm-fw-medium);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: var(--bcm-border-w) solid var(--border);
            color: var(--primary-dark);
            letter-spacing: .2px;
        }

        /* ───────────── Buttons ───────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--bcm-radius);
            text-decoration: none;
            font-weight: var(--bcm-fw-medium);
            transition: background .2s, box-shadow .2s, transform .05s;
            border: var(--bcm-border-w) solid transparent;
            cursor: pointer;
            font-size: var(--bcm-fs-base);
            font-family: inherit;
            line-height: 1.2;
        }
        .btn:active { transform: scale(.98); }

        .btn-primary   { background: var(--primary);  color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-success   { background: var(--primary);  color: var(--white); }
        .btn-success:hover { background: var(--primary-dark); }

        .btn-danger    { background: var(--danger);   color: var(--white); }
        .btn-danger:hover { filter: brightness(.93); }

        .btn-secondary { background: var(--bcm-surface); color: var(--text); border: var(--bcm-border-w) solid var(--bcm-border-strong); }
        .btn-secondary:hover { background: var(--bcm-surface-alt); }

        .btn-accent    { background: var(--accent);   color: var(--white); }
        .btn-accent:hover { filter: brightness(.93); }

        .btn-sm { padding: 7px 13px; font-size: var(--bcm-fs-sm); border-radius: var(--bcm-radius); }

        /* ───────────── Table ───────────── */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            min-width: 600px;
        }
        .table th,
        .table td {
            padding: 11px 14px;
            text-align: right;
            border-bottom: var(--bcm-border-w) solid var(--border);
            font-size: var(--bcm-fs-base);
        }
        .table th {
            background: var(--bcm-primary-050);
            color: var(--primary-dark);
            font-weight: var(--bcm-fw-bold);
            font-size: var(--bcm-fs-sm);
            border-bottom: 2px solid var(--bcm-primary-100);
            white-space: nowrap;
        }
        .table tbody tr:nth-child(even) td { background: var(--bcm-surface-alt); }
        .table tbody tr:hover td { background: var(--bcm-primary-050); }

        /* ───────────── Grid ───────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 18px;
        }
        .financial-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 18px 0;
        }

        /* ── Financial blocks ── */
        .financial-block {
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .financial-block h4 { margin-bottom: 14px; font-size: 16px; }
        .financial-block p  { font-size: 14px; line-height: 1.8; margin: 7px 0; }
        .financial-block table td { padding: 5px 0; }

        /* ── Balance block ── */
        .balance-block {
            margin: 18px 0;
            padding: 24px;
            text-align: center;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .balance-block h3 { margin: 0; font-size: 17px; }
        .balance-amount { font-size: 30px; font-weight: 800; margin: 10px 0; letter-spacing: .5px; }

        /* ───────────── Stats cards ───────────── */
        .stats-card {
            background: var(--bcm-primary);
            color: var(--bcm-on-primary);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: var(--bcm-border-w) solid var(--bcm-primary-700);
        }
        .stats-card h3      { font-size: var(--bcm-fs-sm); opacity: .9; margin-bottom: 8px; font-weight: var(--bcm-fw-regular); }
        .stats-card .value  { font-size: var(--bcm-fs-2xl); font-weight: var(--bcm-fw-bold); }

        /* ───────────── Form ───────────── */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 11px 13px;
            border: var(--bcm-border-w) solid var(--bcm-border-strong);
            border-radius: var(--bcm-radius);
            /* 16px : évite le zoom automatique des champs au focus sur iOS Safari */
            font-size: 16px;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
            background: var(--white);
            color: var(--text);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* ───────────── Badges ───────────── */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--bcm-radius);
            font-size: var(--bcm-fs-xs);
            font-weight: var(--bcm-fw-bold);
        }
        .badge-success { background: var(--bcm-success-050); color: var(--bcm-primary-700); border: var(--bcm-border-w) solid var(--bcm-primary-100); }
        .badge-warning { background: var(--bcm-warning-050);  color: var(--bcm-warning); border: var(--bcm-border-w) solid #ecdca6; }
        .badge-info    { background: var(--bcm-info-050); color: var(--bcm-info); border: var(--bcm-border-w) solid #bcd8ea; }
        .badge-danger  { background: var(--bcm-danger-050);  color: var(--bcm-danger); border: var(--bcm-border-w) solid #f0c4bf; }

        /* ── Semantic text colors ── */
        .text-success { color: var(--primary)    !important; }
        .text-danger  { color: var(--danger)     !important; }
        .text-accent  { color: var(--accent)     !important; }
        .text-muted   { color: var(--text-muted) !important; }

        /* ───────────── Modales ───────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 26px;
            width: 100%;
            max-width: 440px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            -webkit-overflow-scrolling: touch;
        }

        /* Indice de défilement horizontal sur les tableaux qui débordent */
        .table-wrapper.is-scrollable { position: relative; }
        .table-wrapper.is-scrollable::after {
            content: "‹ ›";
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-muted);
            background: var(--white);
            border: var(--bcm-border-w) solid var(--border);
            border-radius: var(--bcm-radius);
            padding: 1px 7px;
            opacity: .9;
            pointer-events: none;
        }
        .table-wrapper.is-scrollable.scrolled::after { display: none; }

        /* ───────────── Alertes ───────────── */
        .alert {
            padding: 11px 14px;
            border-radius: var(--bcm-radius);
            font-size: var(--bcm-fs-base);
            margin-bottom: 18px;
            text-align: center;
            border-inline-start: 3px solid transparent;
        }
        .alert-error   { background: var(--bcm-danger-050);  color: var(--bcm-danger);      border: var(--bcm-border-w) solid #f0c4bf; border-inline-start-color: var(--bcm-danger); }
        .alert-success { background: var(--bcm-success-050);  color: var(--bcm-primary-700); border: var(--bcm-border-w) solid var(--bcm-primary-100); border-inline-start-color: var(--bcm-primary); }

        /* ───────────── Responsive ───────────── */
        @media (max-width: 880px) {
            .nav-toggle { display: flex; }
            .brand-title { font-size: 16px; }
            .brand-sub { display: none; }
            .user-name { display: none; }

            .nav {
                margin-bottom: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height .3s ease;
                box-shadow: none;
                border-bottom: 1px solid var(--border);
            }
            body.nav-open .nav { max-height: 70vh; overflow-y: auto; box-shadow: var(--shadow); }
            .nav-links { flex-direction: column; gap: 0; }
            .nav-links a {
                padding: 15px 18px;
                border-bottom: 1px solid var(--border);
                border-right: 4px solid transparent;
            }
            .nav-links a.active {
                border-bottom-color: var(--border);
                border-right-color: var(--primary);
                background: var(--primary-light);
            }
        }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .table th, .table td { padding: 10px; font-size: 13px; }
            .grid { grid-template-columns: 1fr; gap: 12px; }
            .financial-grid { grid-template-columns: 1fr; gap: 12px; margin: 12px 0; }
            .btn { padding: 12px 18px; min-height: 46px; }
            .btn-sm { padding: 9px 14px; font-size: 13px; min-height: 0; }
            .card { padding: 16px; }
            .card-header { font-size: 16px; }
            .balance-amount { font-size: 24px; }
            .stats-card .value { font-size: 24px; }
        }
    </style>

    <script>
        // Améliorations d'utilisabilité communes à toutes les pages.
        document.addEventListener('DOMContentLoaded', function () {

            // 1. Fermer le menu mobile en touchant à l'extérieur.
            document.addEventListener('click', function (e) {
                if (!document.body.classList.contains('nav-open')) return;
                var nav = document.querySelector('.nav');
                var toggle = document.querySelector('.nav-toggle');
                if (nav && toggle && !nav.contains(e.target) && !toggle.contains(e.target)) {
                    document.body.classList.remove('nav-open');
                }
            });

            // 2. Empêcher le double envoi : désactiver le bouton après soumission.
            document.querySelectorAll('form').forEach(function (form) {
                form.addEventListener('submit', function () {
                    var btn = form.querySelector('button[type="submit"], button:not([type])');
                    if (!btn || btn.dataset.busy === 'on') return;
                    // setTimeout(0) : laisse le navigateur sérialiser le formulaire d'abord.
                    setTimeout(function () {
                        btn.dataset.busy = 'on';
                        btn.disabled = true;
                        btn.dataset.label = btn.textContent;
                        btn.textContent = '…';
                    }, 0);
                });
            });

            // 3. Modales : fermer en touchant le fond ou via la touche Échap.
            document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) overlay.style.display = 'none';
                });
            });
            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                document.querySelectorAll('.modal-overlay').forEach(function (o) {
                    if (getComputedStyle(o).display !== 'none') o.style.display = 'none';
                });
            });

            // 4. Indice de défilement sur les tableaux trop larges pour l'écran.
            document.querySelectorAll('.table-wrapper').forEach(function (w) {
                if (w.scrollWidth > w.clientWidth + 4) {
                    w.classList.add('is-scrollable');
                    w.addEventListener('scroll', function () {
                        w.classList.toggle('scrolled', Math.abs(w.scrollLeft) > 4);
                    }, { passive: true });
                }
            });
        });
    </script>
</head>

<body>
<div th:fragment="header" class="app-header">
    <header class="topbar">
        <div class="container topbar-inner">
            <button class="nav-toggle" type="button" aria-label="القائمة"
                    onclick="document.body.classList.toggle('nav-open')">
                <span></span><span></span><span></span>
            </button>
            <div class="brand">
                <span class="brand-title">معهد الإمام نافع</span>
                <span class="brand-sub">لتعليم القرآن الكريم وعلومه</span>
            </div>
            <div class="topbar-user">
                <span sec:authentication="name" class="user-name">المستخدم</span>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn-logout">خروج</button>
                </form>
            </div>
        </div>
    </header>
    <nav class="nav">
        <div class="container" style="padding-top:0; padding-bottom:0;">
            <ul class="nav-links">
                <li><a href="/dashboard"       th:classappend="${activePage == 'dashboard'}  ? 'active'">لوحة التحكم</a></li>
                <li><a href="/branches"        th:classappend="${activePage == 'branches'}   ? 'active'">الفروع</a></li>
                <li><a href="/classes"         th:classappend="${activePage == 'classes'}    ? 'active'">الفصول</a></li>
                <li><a href="/donors"          th:classappend="${activePage == 'donors'}     ? 'active'">المتبرعون</a></li>
                <li><a href="/retards"         th:classappend="${activePage == 'retards'}    ? 'active'" style="color:var(--danger);">المتأخرون</a></li>
                <li><a href="/rapport-mensuel" th:classappend="${activePage == 'rapport'}    ? 'active'">التقرير الشهري</a></li>
                <li><a href="/import"          th:classappend="${activePage == 'import'}     ? 'active'">استيراد البيانات</a></li>
            </ul>
        </div>
    </nav>
</div>
</body>
</html>
