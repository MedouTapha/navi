<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — معهد الإمام نافع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bcm-tokens.css}" href="/css/bcm-tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--bcm-font-sans);
            background: var(--bcm-bg);
            color: var(--bcm-text);
            font-size: var(--bcm-fs-base);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--bcm-surface);
            border-radius: var(--bcm-radius);
            box-shadow: var(--bcm-shadow-pop);
            border: var(--bcm-border-w) solid var(--bcm-border);
            border-top: 3px solid var(--bcm-primary);
            width: 100%;
            max-width: 400px;
            padding: 36px 30px;
        }
        .login-card h1 {
            font-size: var(--bcm-fs-lg);
            font-weight: var(--bcm-fw-medium);
            color: var(--bcm-primary-700);
            text-align: center;
            margin-bottom: 6px;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--bcm-text-muted);
            font-size: var(--bcm-fs-sm);
            margin-bottom: 26px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: var(--bcm-fw-medium);
            font-size: var(--bcm-fs-base);
        }
        .form-control {
            width: 100%;
            padding: 11px 13px;
            border: var(--bcm-border-w) solid var(--bcm-border-strong);
            border-radius: var(--bcm-radius);
            /* 16px : évite le zoom automatique au focus sur iOS Safari */
            font-size: 16px;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus { outline: none; border-color: var(--bcm-primary); box-shadow: 0 0 0 3px var(--bcm-primary-050); }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--bcm-primary);
            color: var(--bcm-on-primary);
            border: var(--bcm-border-w) solid var(--bcm-primary-700);
            border-radius: var(--bcm-radius);
            font-size: var(--bcm-fs-md);
            font-weight: var(--bcm-fw-medium);
            cursor: pointer;
            font-family: inherit;
            transition: background .2s;
            margin-top: 6px;
        }
        .btn-login:hover { background: var(--bcm-primary-700); }
        .alert {
            padding: 11px 14px;
            border-radius: var(--bcm-radius);
            font-size: var(--bcm-fs-base);
            margin-bottom: 18px;
            text-align: center;
        }
        .alert-error { background: var(--bcm-danger-050); color: var(--bcm-danger); border: var(--bcm-border-w) solid #f0c4bf; }
        .alert-success { background: var(--bcm-success-050); color: var(--bcm-primary-700); border: var(--bcm-border-w) solid var(--bcm-primary-100); }
    </style>
</head>
<body>
<div class="login-card">
    <h1>معهد الإمام نافع</h1>
    <p class="subtitle">نظام إدارة تعليم القرآن الكريم وعلومه</p>

    <div th:if="${param.error}" class="alert alert-error">
        اسم المستخدم أو كلمة المرور غير صحيحة
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        تم تسجيل الخروج بنجاح
    </div>
    <div th:if="${param.expired}" class="alert alert-error">
        انتهت صلاحية الجلسة، يرجى إعادة تسجيل الدخول
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus />
        </div>
        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn-login">دخول</button>
    </form>
</div>
</body>
</html>
