<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — معهد الإمام نافع</title>
    <style>
        :root {
            --primary: #1B6B3A;
            --primary-dark: #134d2a;
            --accent: #B8860B;
            --danger: #C0392B;
            --bg: #f4f6f4;
            --border: #d8e4d8;
            --text: #1a2e1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,.25);
            width: 100%;
            max-width: 400px;
            padding: 36px 30px;
            border-top: 5px solid var(--accent);
        }
        .login-card h1 {
            font-size: 19px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 6px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #6c7569;
            font-size: 13px;
            margin-bottom: 26px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color .2s;
        }
        .form-control:focus { outline: none; border-color: var(--primary); }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background .2s;
            margin-top: 6px;
        }
        .btn-login:hover { background: var(--primary-dark); }
        .alert {
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 18px;
            text-align: center;
        }
        .alert-error { background: #fdecea; color: var(--danger); border: 1px solid #f0b8b2; }
        .alert-success { background: #e8f5ee; color: var(--primary-dark); border: 1px solid #b8d8c8; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>معهد الإمام نافع</h1>
    <p class="subtitle">نظام إدارة تعليم القرآن الكريم وعلومه</p>

    <div th:if="${param.error}" class="alert alert-error">
        اسم المستخدم أو كلمة المرور غير صحيحة
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        تم تسجيل الخروج بنجاح
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus />
        </div>
        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn-login">دخول</button>
    </form>
</div>
</body>
</html>
