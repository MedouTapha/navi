# Application Name
spring.application.name=navi-education

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
# URL composée depuis DB_HOST/DB_PORT/DB_NAME (Render, Railway, VPS...)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:navi_education}
spring.datasource.username=${DB_USERNAME:navi_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.navi.education=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/navi-education.log
logging.file.max-size=10MB
logging.file.max-history=30

# Date Format
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss

# Disable H2 Console in production
spring.h2.console.enabled=false

# Error handling
server.error.include-message=never
server.error.include-stacktrace=never

# ─────────────────────────────────────────────────────────────
# Sécurité (production)
# ─────────────────────────────────────────────────────────────
# Compte administrateur — DOIT être fourni via variables d'environnement
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}

# Pas de données de démonstration en production
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Session sécurisée (cookies HTTPS only)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Application servie derrière un reverse-proxy Nginx (HTTPS)
server.forward-headers-strategy=framework
