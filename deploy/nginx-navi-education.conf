# ════════════════════════════════════════════════════════════════
#  Nginx reverse-proxy — Navi Education
#  Copier vers : /etc/nginx/sites-available/navi-education
#  Activer     : sudo ln -s /etc/nginx/sites-available/navi-education \
#                            /etc/nginx/sites-enabled/
#  Remplacer "votre-domaine.com" par votre vrai domaine, puis :
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d votre-domaine.com   (active le HTTPS)
# ════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name votre-domaine.com;

    # Taille max upload (rapports/pièces jointes éventuelles)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 90s;
    }
}

# Après "sudo certbot --nginx", Certbot ajoute automatiquement le bloc
# d'écoute HTTPS (443) + la redirection HTTP -> HTTPS ci-dessus.
